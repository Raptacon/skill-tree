tree: baseline
# tiered: false in trees.yml - single pass/fail checklist, no tier ladder.
# Order matters here: this is roughly the sequence a brand-new student walks through.
skills:
  - id: baseline-intake-forms
    name: Registration and Permission Forms
    description: Parent/guardian permission, medical form, liability waiver on file with a mentor
    resources: []

  - id: baseline-team-fees
    name: Team Fees
    description: Fee paid, or a fee waiver/scholarship confirmed with a mentor
    resources: []

  - id: baseline-safety-training
    name: FIRST Safety Training
    description: FIRST's official safety training videos and quiz, completed and on file
    resources:
      - type: doc
        label: "FIRST safety training (ask a mentor for the current link/portal)"

  - id: baseline-safety
    name: Shop Safety
    description: PPE, e-stop locations, hair/loose clothing, general shop rules - walkthrough with a mentor
    resources: []

  - id: baseline-tools
    name: Basic Tool Familiarity
    description: Can identify and safely handle common hand tools
    resources: []

  - id: baseline-git
    name: Git and Collaboration Basics
    description: Clone, commit, push/pull, basic branching
    resources: []

  - id: baseline-culture
    name: Team Culture
    description: Team norms, communication expectations, safety culture
    resources: []

  - id: baseline-decide-track
    name: Decide Your Track
    description: >-
      Shadow each subteam for at least one meeting - Manufacturing, Design,
      Electronics, Programming, Business/Media - then pick a primary tree to
      start logging hours against. Not permanent; you can switch, add a
      hybrid, or branch into a specialization (like LEDs) later.
    resources: []
