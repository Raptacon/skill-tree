  # Added per mentor request: drawings need to encode this season's actual
  # game-legal envelope and game-piece geometry, not just fit/function.
  - id: design-game-rules-in-drawings
    tier: 3
    name: Designing to the Game Rules
    description: >-
      Encoding the current season's game manual constraints - robot size/weight/
      extension envelope, game piece and field-element geometry - directly into
      models and drawings, and cross-checking the model against them before
      release.
    resources:
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: constants/robot_geometry.py
        label: "Robot-2026's real frame/module dimensions - what a model's drawings must match"
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: constants/field_target_constants_2026.py
        label: "Robot-2026's real field-element coordinates for this season's game"

  - id: design-design-reviews
    tier: 3
    name: Running a Design Review
    resources: []

  # --- Tier 4: Master ---
  - id: design-leads-design-reviews
    tier: 4
    name: Leads Design Reviews
    resources: []

  - id: design-owns-cad-standards
    tier: 4
