tree: business
# Designed from scratch (no example content existed for this tree) -
# grounded in the real work FRC "business/media" subteams do: social media,
# sponsor relations, pit displays, and award submissions (Chairman's/Impact
# Award, Woodie Flowers). Mentors should adjust freely.
skills:
  # --- Tier 1: Novice ---
  - id: biz-social-basics
    tier: 1
    name: Social Media Basics
    description: Posting on the team's accounts following brand/voice guidelines
    resources: []

  - id: biz-photo-basics
    tier: 1
    name: Event Photography Basics
    description: Taking usable event/pit/match photos with a phone or camera
    resources: []

  - id: biz-team-pitch
    tier: 1
    name: Team Pitch
    description: Can explain the team's history, mission, and sponsors to a stranger in under a minute
    resources: []

  # --- Tier 2: Journeyman ---
  - id: biz-content-calendar
    tier: 2
    name: Content Calendar
    description: Plans and runs a social content calendar across a build season or competition weekend
    resources: []

  - id: biz-photo-video-shoot
    tier: 2
    name: Running a Photo/Video Shoot
    description: Plans and runs a shoot at a competition (pit, matches, robot reveal)
    resources: []

  - id: biz-sponsor-thankyou
    tier: 2
    name: Sponsor Recognition
    description: Writes sponsor thank-you notes and recognition posts
    resources: []

  - id: biz-pit-display
    tier: 2
    name: Pit Display and Scouting Materials
    description: Builds and maintains the pit display and scouting handout materials
    resources: []

  # --- Tier 3: Expert ---
  - id: biz-award-essay
    tier: 3
    name: Award Submission Writing
    description: Co-writes an award submission essay (Chairman's/Impact Award, Woodie Flowers nomination)
    resources: []

  - id: biz-sponsor-communications
    tier: 3
    name: Sponsor Communications
    description: Leads sponsor outreach - asks, season updates, renewal thank-yous
    resources: []

  - id: biz-media-analytics
    tier: 3
    name: Media Strategy and Analytics
    description: Sets the team's social strategy and reads engagement analytics to adjust it
    resources: []

  # --- Tier 4: Master ---
  - id: biz-owns-brand-strategy
    tier: 4
    name: Owns Brand and Media Strategy
    description: Owns the team's brand/media strategy season-to-season and trains new members
    resources: []

  - id: biz-outreach-program
    tier: 4
    name: Community Outreach Program
    description: Designs and leads a community outreach or STEM demo program
    resources: []
