# Every push and PR: validate YAML, lint for personal data, build the site.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pipenv && pipenv install --deploy
      - run: make ci
