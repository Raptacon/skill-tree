# Onboarding - the first tree every team member works through, every season.
#
# One file, items inline, each tagged with the roles it applies to; renderers
# produce one checklist per role, and a person with several roles sees the union
# (docs/adr/0001, 0004).
#
# Item fields
#   id          global, stable, never reused (progress is recorded against it)
#   name / description
#   section     which section below it renders under
#   roles       list of role ids, or {role, when: <condition>} for conditional
#   actor       role that actually does it, when different from who it's for
#               (a parent signs the FIRST consent *for* their student)
#   kind        check | count | hours | score | signature | external | timed
#   target      for count/hours; pass_score for score; runs for timed (best time recorded)
#   track       optional label for a path within a tree (e.g. Strategy, Scouting, Drive)
#   verify      method: auto | self | signoff | signature | score
#               by:     {role: x} | {person: "@github"} | {any_of: [...]}
#               source: where `auto` reads from (Master Roster tab/column)
#               claim:  true = person self-reports, a verifier confirms
#   renews      season | permanent | event
#   visibility  public | team | mentors | self
#   requires    [item-id, {hours: N}, ...]
#   required    default true; false = recommended, not blocking
#   status      active (default) | draft = not live, shown greyed for review
#   training    [{type: video|doc|form|link|session|repo, label, url?, roles?}] -
#               how to learn it (`session` = hands-on with a mentor); roles limits
#               which checklists show it
#   bonus       [{label, url}] - optional fun or interesting extra; never required
#   practical   {summary, steps: [...]} - the test: the exact hands-on task a
#               verifier has the person perform, in order
#   parts       [{id, name, by}] - named sub-sign-offs that together complete the
#               item (e.g. one per subteam shadowed)
#
# Authorship (tree-level defaults; any item may override with its own values)
#   authored_by [{name, github}]  first + last name and GitHub username - credit
#               where credit is due, and who to ask. No emails (keeps student
#               contact info out of the repo)
#   created_at  YYYY-MM-DD, set once
#   updated_at  YYYY-MM-DD, bump on any change (CI will check a PR that edits an
#               item also bumps this, and warn when it's old enough to be stale)
#
# Tree-level (optional)
#   badge       {name, description} - rank earned by finishing every required item
#   next        {tree, text} - where to go after this tree

tree:
  id: onboarding
  name: Onboarding
  kind: onboarding
  authored_by:
    - {name: Chris Hirsch, github: ChrisHirsch}
  created_at: 2026-10-13
  updated_at: 2026-10-20
  badge:
    name: Rookie
    description: Signed up, paid, handbook signed, safety done - you're on the team.
  next:
    tree: baseline
    text: >-
      Next up: Baseline. Learn the shop tools, git and the team board, shadow
      every subteam, then choose your track.
  description: >-
    Everything you need to be a fully on-boarded member of Raptacon 3200 this
    season - what you need depends on your role. Most items check themselves off
    automatically from the team roster; the rest a mentor signs off.

sections:
  - {id: join, name: Join the Team}
  - {id: paperwork, name: Paperwork}
  - {id: first, name: FIRST Registration}
  - {id: district, name: School District (CCSD)}
  - {id: safety, name: Safety}
  - {id: connected, name: Get Connected}
  - {id: started, name: Get Started}
  - {id: help, name: Help the Team}
  - {id: travel, name: Field Trips}

items:
  # ---------------------------------------------------------------- join
  - id: onb-raptacon-signup
    name: Sign up with Raptacon
    description: Fill out this season's Raptacon sign-up form for your role (new or returning).
    section: join
    roles: [student, parent, mentor, volunteer, board]
    kind: check
    verify: {method: auto, source: {tab: "<role roster tab>", where: "Status = Active"}}
    renews: season
    visibility: team
    training:
      - {type: form, label: Student sign-up form, roles: [student]}
      - {type: form, label: Parent sign-up form, roles: [parent]}
      - {type: form, label: Mentor / Volunteer sign-up form, roles: [mentor, volunteer, board]}
    notes: No separate board form - board members use the parent or mentor/volunteer form and mark board interest.

  - id: onb-dues
    name: Team dues
    description: >-
      $250/year if paid in full in the 1st quarter, or $270 over time - 3 payments
      of $90, due in October, December and March. Scholarships are available; ask the treasurer. Paid in
      full, on the payment plan, or on a scholarship all count as done. Nobody but
      you, your parents and the treasurer sees this.
    section: join
    roles: [student]
    actor: parent
    kind: check
    verify:
      method: auto
      source: {tab: Balances, where: "Category = Dues and Balance Due <= 0"}
      by: {role: treasurer}    # treasurer records plans/scholarships
    renews: season
    visibility: self
    training:
      - {type: link, label: Pay dues, url: "https://pay.raptacon.org"}

  # ---------------------------------------------------------------- paperwork
  - id: onb-handbook
    name: Read and sign the team handbook
    description: >-
      Read this season's Raptacon handbook and submit the acknowledgment form (no
      Google account needed). Students and their parent/guardian each submit one;
      a parent with two students submits once per student. Can't do it online?
      Sign the paper page and hand it to a mentor.
    section: paperwork
    roles: [student, parent, mentor, volunteer, board]
    kind: signature
    verify:
      method: signature
      # Version is "<season> (rev YYYY-MM)"; any revision of this season counts.
      # Students: own ack + a parent ack with matching "Your student's School ID".
      # Parents: an ack for each of their students. Rows flagged Possible Duplicate are skipped.
      source: {tabs: [Handbook_Acks, Handbook_Acks_Paper], version_prefix: season}
    renews: season
    visibility: team
    training:
      - {type: doc, label: "Raptacon Handbook 2026-27", url: "https://docs.google.com/document/d/19xdyY0cUXU5lqMMsEIhkcs5NqTy1XQ93uskZNUNlgAY/view"}
      - {type: form, label: Handbook acknowledgment form, url: "https://docs.google.com/forms/d/e/1FAIpQLScWCkReToQ0QJ1SzqZzZwIr7HtPNzqyHdEWpxzEHoWSDCSWuA/viewform"}

  - id: onb-emergency-info
    name: Emergency contact and medical info on file
    section: paperwork
    roles: [student, mentor, volunteer, parent]
    kind: check
    verify:
      method: auto
      source: {tab: "<role roster tab>", columns: [Emergency Contact Name, Emergency Contact Phone]}
    renews: season
    visibility: mentors
    notes: Parent form doesn't collect emergency contact yet (onboarding-system PLAN item 5).

  - id: onb-photo-release
    name: Photo / media release answered
    description: Yes or no are both fine - we just need an answer on file.
    section: paperwork
    roles: [student]          # TODO adults too?
    kind: check
    verify: {method: auto, source: {tab: Students_Active, columns: [Photo/Media Release]}}
    renews: season
    visibility: mentors

  # ---------------------------------------------------------------- FIRST
  - id: onb-first-dashboard
    name: Registered in the FIRST Dashboard
    description: Create/renew your FIRST account and join team 3200's roster.
    section: first
    roles: [student, mentor]
    kind: external
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}
    renews: season
    visibility: team
    training:
      - {type: link, label: FIRST Dashboard, url: "https://my.firstinspires.org/"}

  - id: onb-first-consent
    name: FIRST Consent & Release form signed
    description: >-
      Required by FIRST every season. A parent/guardian signs it for the student in
      the FIRST Dashboard - students, remind your parent; parents, this one's yours.
    section: first
    roles: [student, parent]
    actor: parent
    kind: external
    requires: [onb-first-dashboard]
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}   # lead mentor sees consent status in the Dashboard
    renews: season
    visibility: team

  - id: onb-first-ypp
    name: FIRST Youth Protection screening
    description: FIRST's Youth Protection Program screening for adults working with students.
    section: first
    roles: [mentor]
    kind: external
    requires: [onb-first-dashboard]
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}
    renews: season          # TODO confirm FIRST's screening validity period
    visibility: mentors
    notes: >-
      FIRST requires it for Lead Mentor 1/2 (condition first-lead-mentor). TODO decide
      whether Raptacon requires it for all mentors - drafted as all mentors.

  - id: onb-first-mentor-training
    name: FIRST mentor training
    section: first
    roles: [mentor]
    kind: external
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}
    renews: season
    visibility: team
    status: draft
    notes: TODO which FIRST trainings exactly.

  # ---------------------------------------------------------------- district
  - id: onb-ccsd-volunteer-forms
    name: CCSD volunteer forms
    section: district
    roles:
      - {role: mentor, when: ccsd-volunteer}
      - {role: volunteer, when: ccsd-volunteer}
      - {role: parent, when: ccsd-volunteer}
      - {role: board, when: ccsd-volunteer}
    kind: external
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}
    renews: season
    visibility: mentors

  - id: onb-ccsd-fingerprinting
    name: CCSD fingerprinting
    description: Becomes available after 150 volunteer hours.
    section: district
    roles:
      - {role: mentor, when: ccsd-volunteer}
      - {role: volunteer, when: ccsd-volunteer}
      - {role: parent, when: ccsd-volunteer}
    kind: external
    requires: [onb-ccsd-volunteer-forms, {hours: 150}]
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}
    renews: permanent       # TODO confirm with CCSD
    visibility: mentors

  - id: onb-background-check
    name: Background check complete
    section: district
    roles:
      - mentor
      - {role: parent, when: chaperone}
      - {role: volunteer, when: chaperone}
    kind: check
    verify: {method: auto, source: {tab: MentorsVolunteers_Active, where: "Background Check Status = Completed"}}
    notes: >-
      TODO parents/volunteers who chaperone - background check status belongs in the
      roster but isn't designed yet (Parents_Active has no such column). Needs a
      raptacon-onboarding-system change.
    renews: season          # TODO confirm policy; may be the same thing as CCSD forms
    visibility: mentors

  # ---------------------------------------------------------------- safety
  - id: onb-safety-test
    name: Safety test passed
    description: Students and mentors take the same test.
    section: safety
    roles: [student, mentor]
    kind: score
    pass_score: null        # TODO
    verify:
      method: signoff       # v1: mentor confirms the Schoology result; v2 = auto-graded team quiz
      claim: true
      by: {any_of: [{role: safety-officer}, {role: lead-mentor}]}
    renews: season
    visibility: team
    training:
      - {type: link, label: Safety test (Schoology)}   # TODO link

  - id: onb-shop-orientation
    name: Shop safety orientation
    description: >-
      Walkthrough with a mentor: PPE, e-stops, fire extinguisher, first aid, hair and
      loose clothing, shop rules.
    section: safety
    roles: [student, mentor]
    kind: check
    requires: [onb-safety-test]
    verify: {method: signoff, by: {any_of: [{role: safety-officer}, {role: lead-mentor}]}}
    renews: season
    visibility: public

  - id: onb-safety-glasses
    name: Your safety glasses
    description: >-
      The team gives you one pair of safety glasses. Label them clearly with your
      name and keep them in the safety glasses pocket. Grab them from the pocket at
      the start of every meeting and put them back when you leave.
    section: safety
    roles: [student]
    kind: check
    verify: {method: signoff, by: {role: mentor}}   # any mentor can check the label
    renews: season
    visibility: team

  # ---------------------------------------------------------------- connected
  - id: onb-discord
    name: Join the team Discord
    section: connected
    roles: [student, parent, mentor, volunteer, board]
    kind: check
    verify: {method: self}
    renews: permanent
    visibility: team

  - id: onb-calendar
    name: Subscribe to the team calendar
    section: connected
    roles: [student, parent, mentor, volunteer, board]
    kind: check
    verify: {method: self}
    renews: permanent
    visibility: team

  - id: onb-remind
    name: Join Remind for team texts
    description: "Text @3200rapta to 81010."
    section: connected
    roles: [student, parent, mentor, volunteer, board]
    kind: check
    verify: {method: self}
    renews: season          # Remind classes are usually set up per school year
    visibility: team

  - id: onb-github
    name: GitHub account linked
    description: >-
      Create a GitHub account with your first and last name as the username -
      firstnamelastname, e.g. janedoe (add a number if it's taken). It's easy for
      the team to find and looks good on a resume later. Then add it to your sign-up
      form (returning members: use the "Updated GitHub username" question). This
      is also the first step of the Kanban tree.
    section: connected
    roles: [student, mentor]
    kind: check
    verify: {method: auto, source: {tab: "<role roster tab>", columns: [GitHub Username]}}
    renews: permanent
    visibility: team

  # ---------------------------------------------------------------- started
  - id: onb-presence-hours
    name: First 10 hours at the shop
    description: Check in and out at meetings - hours come straight from the check-in system.
    section: started
    roles: [student]
    kind: hours
    target: 10
    verify: {method: auto, source: {tab: CheckIns, sum: "Duration (min)"}}
    renews: season
    visibility: public

  # ---------------------------------------------------------------- help
  - id: onb-saturday-food
    name: Sign up for Saturday food (2 minimum)
    description: Bring food for at least two Saturday build sessions this season.
    section: help
    roles: [parent]
    kind: count
    target: 2
    verify:
      method: signoff       # v1: food coordinator records from SignUpGenius
      by: {role: food-coordinator}
    renews: season
    visibility: team

  - id: onb-mentor-verifier
    name: Approved to sign off a tree
    description: >-
      Lead mentor approves you to verify skills in one or more trees. Recorded per
      tree; this is what lets you sign students off.
    section: help
    roles: [mentor]
    required: false
    kind: check
    requires: [onb-first-ypp, onb-safety-test]
    verify: {method: signoff, by: {role: lead-mentor}}
    renews: permanent
    visibility: team

  - id: onb-board-orientation
    name: Board orientation
    description: Board-specific onboarding - roles, bylaws, finances, meeting cadence.
    section: help
    roles: [board]
    kind: check
    verify: {method: signoff, by: {role: board-chair}}
    renews: season
    visibility: team
    status: draft
    notes: TODO define with the board. Candidates - bylaws review, conflict-of-interest disclosure, financial controls.

  # ---------------------------------------------------------------- travel
  - id: onb-field-trip-form
    name: Annual field trip form
    description: >-
      One field trip form covers the whole season. Individual trips may still
      have their own forms and info - those are handled separately per trip.
    section: travel
    roles: [student]
    actor: parent
    kind: check
    verify: {method: signoff, claim: true, by: {role: lead-mentor}}   # TODO auto-derive once tracked in the roster
    renews: season
    visibility: mentors
