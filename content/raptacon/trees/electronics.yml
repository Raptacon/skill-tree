# Electronics - wiring the robot and its pneumatics so the mechanisms can be
# controlled; the other half of the competition pit crew (handbook 3.4d).
#
# The main quest is Stefan Sell's electronics tier tree (Tier List.xlsx and
# Electronics Tier Tree.pptx, 2026-11): two branches - robot components and
# electrical know-how - each an ordered chain of modules, tiers 1-4. Each
# module's topics are its practical. Skills that aren't in his tree are side
# quests: optional, unlocked by the module they build on, never blocking a tier.
# Fields as documented in onboarding.yml; items use `tier` (or `side_quest`)
# instead of `section`, and `branch` for which chain they belong to.

tree:
  id: electronics
  name: Electronics
  kind: subteam
  requires: [base-choose-track]
  authored_by:
    - {name: Stefan Sell}    # TODO github username
    - {name: Chris Hirsch, github: ChrisHirsch}
  created_at: 2026-10-21
  updated_at: 2026-11-14
  description: >-
    Wire the robot so Programming can control every mechanism: power, CAN,
    sensors and pneumatics - built safely, neatly and to survive a match - then
    keep it running in the pit. Two branches - robot components and electrical
    know-how - with side quests along the way.
  branches:
    - {id: components, name: Robot components}
    - {id: know-how, name: Electrical know-how}

items:
  # ---------------------------------------------------------------- Novice
  - id: elec-robot-tour
    tier: 1
    branch: components
    name: Basic robot component overview
    description: >-
      Name each main part of the robot's electrical system, say what it does, and point to it on the robot.
    roles: [student]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring the FRC control system", url: "https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-1/how-to-wire-a-robot.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - roboRIO
        - Power distribution board
        - Main switch (breaker)
        - Robot signal light
        - Battery
        - Motors
        - Motor controllers
        - Camera
        - Sensors and switches
        - Radio
    renews: season
    visibility: public

  - id: elec-electric-know-how
    tier: 1
    branch: know-how
    name: Basic electric know-how
    description: >-
      The electricity behind the robot, and the tools and habits that keep you and the parts safe.
    roles: [student]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "SparkFun: How to use a multimeter", url: "https://learn.sparkfun.com/tutorials/how-to-use-a-multimeter"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Voltage
        - Current
        - Signals
        - Fuses
        - Insulation
        - Tools, including the multimeter: check a battery's voltage and find a broken wire with the continuity test
        - ESD: ground yourself before touching boards
    renews: permanent
    visibility: public

  # ---------------------------------------------------------------- Journeyman
  - id: elec-motors-overview
    tier: 2
    branch: components
    name: Motors and motor controllers
    description: >-
      The motors we use and the controllers that drive them.
    roles: [student]
    kind: check
    requires: [elec-robot-tour]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - NEO
        - NEO 550
        - NEO Vortex
        - Kraken X60
        - Kraken X44
    renews: permanent
    visibility: public

  - id: elec-sensors-overview
    tier: 2
    branch: components
    name: Sensors and switches
    description: >-
      The sensors and switches on the robot and what each one tells the code.
    roles: [student]
    kind: check
    requires: [elec-robot-tour]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Limit switches
        - Ultrasonic sensors
        - Torque sensors
        - Angle sensors
        - Sensor vs. switch
    renews: permanent
    visibility: public

  - id: elec-cameras-overview
    tier: 2
    branch: components
    name: Cameras
    description: >-
      The kinds of cameras on the robot and what each is for.
    roles: [student]
    kind: check
    requires: [elec-robot-tour]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Type A: the drive team camera
        - Type B: AprilTags
        - Type C
        - AI camera
    renews: permanent
    visibility: public

  - id: elec-battery-safety
    tier: 2
    branch: components
    name: Battery 101
    description: >-
      The robot battery: what it is, how to charge it, check it and label it - and how to carry, connect and store it safely.
    roles: [student]
    kind: check
    requires: [elec-robot-tour]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Robot battery basics", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/robot-battery.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Type: lead vs. lithium
        - Properties of the FRC lead-acid battery
        - Charge and charger
        - Battery check
        - Labeling
    renews: season
    visibility: public

  - id: elec-controllers-overview
    tier: 2
    branch: components
    name: Controllers and power distribution
    description: >-
      The control system in detail: the roboRIO, the NAV module, the power distribution board (breakers and fuses) and voltage regulators.
    roles: [student]
    kind: check
    requires: [elec-robot-tour]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring the FRC control system", url: "https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-1/how-to-wire-a-robot.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - roboRIO in detail
        - NAV module
        - Power distribution board in detail
        - Voltage regulators
    renews: permanent
    visibility: public

  - id: elec-safe-wiring
    tier: 2
    branch: know-how
    name: Basic wiring knowledge
    description: >-
      Choose the right wire for the job.
    roles: [student]
    kind: check
    requires: [elec-electric-know-how]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring best practices", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/wiring-best-practices.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Types of wire: power, signal, CAN
        - Wire gauges
        - Wire colors
    renews: permanent
    visibility: public

  - id: elec-connectors-overview
    tier: 2
    branch: know-how
    name: Connectors
    description: >-
      The ways we join wires and land them on devices.
    roles: [student]
    kind: check
    requires: [elec-electric-know-how]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Crimp (ferrule)
        - Clamps (Wago)
        - Soldering (e.g. the old 2-pin XT60)
        - Screws
        - Terminals, including ring crimp terminals
    renews: permanent
    visibility: public

  - id: elec-can-bus
    tier: 2
    branch: know-how
    name: CAN 101
    description: >-
      How the CAN bus connects the motor controllers and sensors.
    roles: [student]
    kind: check
    requires: [elec-electric-know-how]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: CAN wiring basics", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/can-wiring-basics.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Daisy chain
        - Wires
        - CAN hubs
        - SPARK MAX cables (JST-PH 4)
    renews: permanent
    visibility: public

  - id: elec-soldering
    tier: 2
    branch: know-how
    name: Basic soldering
    description: >-
      Solder safely and well: tin, join and heat-shrink.
    roles: [student]
    kind: check
    requires: [elec-electric-know-how]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "Adafruit Guide to Excellent Soldering", url: "https://learn.adafruit.com/adafruit-guide-excellent-soldering"}
    practical:
      summary: Solder in front of a lead or mentor, then set the iron back in its stand and turn it off.
      steps:
        - Principles of soldering
        - Samples: good and bad joints
        - Practice 1: wire on connector
        - Practice 2: wire on wire
    renews: permanent
    visibility: public

  - id: elec-crimping
    tier: 2
    branch: know-how
    name: Crimp 1
    description: >-
      Crimp the connectors on our robot, then pull-test every one.
    roles: [student]
    kind: check
    requires: [elec-connectors-overview]
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring best practices", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/wiring-best-practices.html"}
    practical:
      summary: Make each termination with a lead or mentor watching.
      steps:
        - Anderson SB50 (battery)
        - Anderson Powerpole (45 A)
        - Ferrule
        - Molex (signal connectors)
        - Practice 1
        - Practice 2
    renews: permanent
    visibility: public

  # ---------------------------------------------------------------- Expert
  - id: elec-motors-deep-dive
    tier: 3
    branch: components
    name: Motor deep dive
    description: >-
      Pick the right motor for a mechanism, and explain why.
    roles: [student]
    kind: check
    requires: [elec-motors-overview]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Motor properties
        - Motor applications
        - Comparison of motors
    renews: permanent
    visibility: public

  - id: elec-sensors-deep-dive
    tier: 3
    branch: components
    name: Sensor and switch deep dive
    description: >-
      How sensors and switches actually work, electrically.
    roles: [student]
    kind: check
    requires: [elec-sensors-overview]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Switches: normally open / normally closed
        - Voltage-based sensors and switches
        - Current-based sensors and switches
        - Digital sensors and switches
        - Relays
        - Signal amplification
    renews: permanent
    visibility: public

  - id: elec-cameras-deep-dive
    tier: 3
    branch: components
    name: Camera deep dive
    roles: [student]
    kind: check
    requires: [elec-cameras-overview]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-battery-testing
    tier: 3
    branch: components
    name: Battery healthcare
    description: >-
      Keep every battery match-ready: read discharge curves, test with the battery analyzer, log results and age, and retire weak batteries before they cost a match.
    roles: [student]
    kind: check
    requires: [elec-battery-safety]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    training:
      - {type: doc, label: "WPILib: Robot battery basics", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/robot-battery.html"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Discharge curve (lead batteries, C-rating)
        - Test capacity and internal resistance with the battery analyzer
        - Log each battery's results and age
    renews: season
    visibility: public
    notes: Nathan Beasley had an idea for NFC tags on batteries to log them automatically - fold it in when it exists.

  - id: elec-circuit-101
    tier: 3
    branch: know-how
    name: Circuit 101
    roles: [student]
    kind: check
    requires: [elec-safe-wiring]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-advanced-can-1
    tier: 3
    branch: know-how
    name: Advanced CAN 1
    description: >-
      Set up and debug bigger CAN networks.
    roles: [student]
    kind: check
    requires: [elec-can-bus]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - CAN IDs (set them in software)
        - Advanced CAN loops
        - CAN hubs
    renews: permanent
    visibility: public

  - id: elec-desoldering
    tier: 3
    branch: know-how
    name: Advanced soldering
    description: >-
      Desolder and rework without lifting pads; solder terminals and boards.
    roles: [student]
    kind: check
    requires: [elec-soldering]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    training:
      - {type: doc, label: "Adafruit Guide to Excellent Soldering (incl. desoldering)", url: "https://learn.adafruit.com/adafruit-guide-excellent-soldering"}
    practical:
      summary: Show a lead or mentor you can explain or do each of these.
      steps:
        - Principles of advanced soldering
        - Desoldering
        - Samples: terminals and PCBs
        - Practice 3
        - Practice 4
    renews: permanent
    visibility: public

  # ---------------------------------------------------------------- Master
  - id: elec-actuators-overview
    tier: 4
    branch: components
    name: Actuators
    roles: [student]
    kind: check
    requires: [elec-motors-deep-dive]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-pneumatics-overview
    tier: 4
    branch: components
    name: Pneumatics
    roles: [student]
    kind: check
    requires: [elec-sensors-deep-dive]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-advanced-circuits
    tier: 4
    branch: know-how
    name: Advanced circuits
    roles: [student]
    kind: check
    requires: [elec-circuit-101]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-advanced-connectors
    tier: 4
    branch: know-how
    name: Advanced connectors
    roles: [student]
    kind: check
    requires: [elec-crimping]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-advanced-can-2
    tier: 4
    branch: know-how
    name: Advanced CAN 2
    roles: [student]
    kind: check
    requires: [elec-advanced-can-1]
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    status: draft
    notes: TODO(Stefan) contents.
    renews: permanent
    visibility: public

  - id: elec-owns-system
    tier: 4
    name: Owns the electrical system
    description: Own the robot's electrical design and layout for the season, from first wiring plan to competition.
    branch: master
    roles: [student]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    renews: permanent
    visibility: public

  - id: elec-teach
    tier: 4
    name: Teach
    description: Train others - take a Novice through the basic robot component overview and basic electric know-how.
    branch: master
    roles: [student]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
    renews: permanent
    visibility: public

  # ---------------------------------------------------------------- Side quests
  # Optional skills from before Stefan's tree, each unlocked by the module it builds on.
  - id: elec-wiring-diagrams
    name: Reading a wiring diagram
    description: Read the robot's wiring diagram and trace a circuit from the battery to a motor or sensor.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-electric-know-how]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    renews: permanent
    visibility: public

  - id: elec-oscilloscope
    name: Using an oscilloscope
    description: >-
      Set up probes and the ground clip, timebase and trigger, and look at real signals - PWM, CAN and power noise.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-electric-know-how]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "SparkFun: How to use an oscilloscope", url: "https://learn.sparkfun.com/tutorials/how-to-use-an-oscilloscope"}
    renews: permanent
    visibility: public

  - id: elec-rsl-status-lights
    name: Robot signal light and status lights
    description: >-
      Wire and mount the robot signal light (required by FRC) and any status
      LEDs so the drive team and field staff can read the robot's state. Leads
      into the LEDs specialization.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-robot-tour, elec-crimping]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Status light quick reference", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/status-lights-ref.html"}
    renews: permanent
    visibility: public

  - id: elec-sensor-wiring
    name: Sensor wiring
    description: Wire sensors (limit switches, encoders, breakbeams) to the roboRIO and check they read correctly.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-sensors-overview]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: repo, label: "State machines step 1: a real breakbeam wiring/reading example", url: "https://github.com/Raptacon/Skills-Challenges/tree/main/state_machines/challenge_step_1"}
    renews: permanent
    visibility: public

  - id: elec-pneumatics-control
    name: Pneumatics control
    description: >-
      Wire the compressor, Pneumatic Hub, solenoid valves and pressure
      switch/sensor. Pairs with Manufacturing's "Pneumatics plumbing and
      mounting" (cylinders, tubing, fittings).
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-can-bus]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Pneumatics", url: "https://docs.wpilib.org/en/stable/docs/software/hardware-apis/pneumatics/index.html"}
    renews: permanent
    visibility: public

  - id: elec-firmware-config
    name: Device firmware and configuration
    description: >-
      Image the roboRIO, configure the radio, and update and configure motor controllers (REV Hardware Client, Phoenix Tuner).
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-can-bus]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Imaging your roboRIO", url: "https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-3/imaging-your-roborio.html"}
      - {type: doc, label: "REV Hardware Client", url: "https://docs.revrobotics.com/rev-hardware-client"}
      - {type: doc, label: "CTRE Phoenix Tuner X", url: "https://v6.docs.ctr-electronics.com/en/stable/docs/tuner/index.html"}
    renews: season
    visibility: public

  - id: elec-build-kit
    name: Building a kit
    description: >-
      Build an electronics kit from its instructions - parts identification, orientation, soldering - and get it working.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-soldering]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    bonus:
      - {label: "Ben Eater: build an 8-bit computer on breadboards", url: "https://eater.net/8bit"}
    renews: permanent
    visibility: public

  - id: elec-wiring-harness
    name: Building a wiring harness
    description: Build a neat, labeled, strain-relieved harness that survives a match and is easy to fix.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-crimping, elec-wiring-diagrams]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring best practices", url: "https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/wiring-best-practices.html"}
    renews: permanent
    visibility: public

  - id: elec-power-distribution
    name: Power distribution
    description: The power distribution hub, breakers and fuses, and sizing wire for the expected current draw.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-controllers-overview]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-lead, tree: electronics}, {role: subteam-mentor, tree: electronics}]}}
    training:
      - {type: doc, label: "WPILib: Wiring the FRC control system", url: "https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-1/how-to-wire-a-robot.html"}
    renews: permanent
    visibility: public

  - id: elec-health-monitoring
    name: Power and battery health monitoring
    description: Publish and read power hub and roboRIO voltage, current and brownout data.
    roles: [student]
    side_quest: true
    required: false
    requires: [elec-controllers-overview, elec-battery-testing]
    kind: check
    verify: {method: signoff, by: {any_of: [{role: subteam-mentor, tree: electronics}, {role: lead-mentor}]}}
