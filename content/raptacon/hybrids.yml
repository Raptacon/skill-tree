# Cross-tree hybrid nodes: require partial (Journeyman, tier 2) progress in 2+ trees.
# `skills` lists item ids (from trees/*.yml) this hybrid certifies; `projects` are
# suggested things to build with it.
hybrids:
  - id: controls
    name: Controls
    requires:
      - {tree: electronics, tier: 2}
      - {tree: programming, tier: 2}
    skills: []

  - id: packaging
    name: Packaging
    requires:
      - {tree: design, tier: 2}
      - {tree: electronics, tier: 2}
    skills: []

  - id: fab-assembly
    name: Fab Assembly
    requires:
      - {tree: manufacturing, tier: 2}
      - {tree: electronics, tier: 2}
    hours: 2
    skills:
      - mfg-component-mounting

  - id: dfm
    name: DFM
    requires:
      - {tree: manufacturing, tier: 2}
      - {tree: design, tier: 2}
    hours: 8
    skills:
      - mfg-model-clearances
      - mfg-update-measurements
      - mfg-3d-slicing
      - mfg-tool-path-cnc
      - des-gdt-dfm

  - id: mechatronics
    name: Mechatronics
    requires:
      - {tree: manufacturing, tier: 2}
      - {tree: programming, tier: 2}
    hours: 1
    skills:
      - mfg-sensor-mounting

  - id: scouting-software
    name: Scouting Software
    # Building and running the team's scouting system (handbook 7.2g).
    requires:
      - {tree: programming, tier: 2}
      - {tree: strategy, tier: 2}
    skills: []

  - id: embedded-systems
    name: Embedded Systems
    # Microcontrollers and custom hardware the robot and team use.
    requires:
      - {tree: electronics, tier: 2}
      - {tree: programming, tier: 2}
    skills: [elec-microcontrollers]
    projects:
      - Cone course timing gates - beam breaks that time and log the RC and robot cone courses
      - Battery tracker - NFC tags on batteries and a reader on the charging cart that logs cycles and test results
      - Shop check-in tap - an NFC/RFID reader that posts to the team check-in system
      - E-paper name tags showing tier dots and badges
      - Custom LED controller - a microcontroller driving the robot's addressable LEDs with status from the roboRIO
      - Custom I2C sensor (time-of-flight, color) reported to the roboRIO
      - Reverse engineer an undocumented device's protocol with a logic analyzer and AI help, then write a driver for it
