tree: electronics
# Journeyman+ students here (or in Programming) can branch into the LEDs
# specialization (data/skills/leds.yml) - see trees.yml's `parent_trees`.
skills:
  # --- Tier 1: Novice ---
  - id: elec-safe-wiring
    tier: 1
    name: Safe Wiring Basics
    description: Wire gauge selection, connectors, crimping, basic electrical safety
    supervision: direct
    resources: []

  - id: elec-battery-safety
    tier: 1
    name: Battery Handling and Charging Safety
    supervision: direct
    resources: []

  - id: elec-reading-schematics
    tier: 1
    name: Reading a Wiring Diagram
    supervision: direct
    resources: []

  # --- Tier 2: Journeyman ---
  - id: elec-wiring-harness
    tier: 2
    name: Builds Wiring Harness
    supervision: direct
    resources: []

  - id: elec-power-distribution
    tier: 2
    name: Power Distribution
    description: PDP/PDH, breakers/fuses, sizing wire gauge to expected current draw
    supervision: direct
    resources: []

  - id: elec-sensor-wiring
    tier: 2
    name: Sensor Wiring
    description: Wiring and reading sensors (limit switches, encoders, breakbeams)
    supervision: direct
    resources:
      - type: repo
        url: https://github.com/Raptacon/Skills-Challenges
        path: state_machines/challenge_step_1
        label: State Machines - Step 1 (a real breakbeam wiring/reading example)

  # --- Tier 3: Expert ---
  - id: elec-pcb-design-debug
    tier: 3
    name: PCB Design and Debug
    resources: []

  - id: elec-health-monitoring
    tier: 3
    name: Power and Battery Health Monitoring
    description: Publishing/reading PDP and RobotController voltage, current, and brownout data
    resources:
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: subsystem/health_and_status.py
        label: "HealthAndStatus - real subsystem publishing PDP/battery/brownout telemetry"

  - id: elec-brownout-prevention
    tier: 3
    name: Brownout Diagnosis and Prevention
    description: Reading current-draw/voltage-sag symptoms back to a wiring or breaker cause
    resources: []

  # --- Tier 4: Master ---
  - id: elec-owns-electrical-system
    tier: 4
    name: Owns Electrical System
    resources: []

  - id: elec-mentors-wiring
    tier: 4
    name: Trains Others on Safe Wiring
    resources: []
