tree: leds
# Basics of electronics through a full addressable dot-matrix display and,
# eventually, a simple on-robot game. Draws on Electronics + Programming
# fundamentals but has its own ladder (see the note in trees.yml).
# Tiers 3-4's exact hardware (matrix size, wiring) don't exist on the team
# yet - those skills describe the learning path, not a shipped example.
skills:
  # --- Tier 1: Novice - basics of electronics ---
  - id: leds-circuit-basics
    tier: 1
    name: LED Circuit Basics
    description: Voltage, current, resistance, why an LED needs a current-limiting resistor
    resources: []

  - id: leds-polarity-datasheets
    tier: 1
    name: Polarity and Reading a Datasheet
    description: Anode/cathode, forward voltage, reading an LED or strip datasheet
    resources: []

  - id: leds-digital-output-subsystem
    tier: 1
    name: A Single LED as a Subsystem
    description: Wrapping a digital-output LED in a Subsystem with command factories (on/off/toggle/while-held)
    resources:
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: examples/inputFactory/led.py
        label: "LEDSubsystem - real example: DigitalOutput, command factories, rumble feedback"

  # --- Tier 2: Journeyman - addressable strips ---
  - id: leds-addressable-strip
    tier: 2
    name: Addressable LED Strips
    description: wpilib.AddressableLED and the team's Strip helper - setting colors on a real strip
    resources:
      - type: repo
        url: https://github.com/Raptacon/Skills-Challenges
        path: state_machines/challenge_step_1
        label: State Machines - Step 1 (breakbeam sensor drives an addressable strip)
      - type: doc
        label: "raptacon3200.utils.leds.Strip (pip package raptacon3200==2025.1.0, ask a mentor for source access)"

  - id: leds-state-driven-behavior
    tier: 2
    name: State-Driven LED Behavior
    description: Reacting to a sensor by driving LED state transitions (StatefulAutonomous pattern)
    resources:
      - type: repo
        url: https://github.com/Raptacon/Skills-Challenges
        path: state_machines/challenge_step_2
        label: State Machines - Step 2

  # --- Tier 3: Expert - full dot matrix ---
  # confirm scope with mentor - no matrix hardware/code exists on the team yet,
  # this describes the learning path per the "learning path only" decision.
  - id: leds-2d-grid-mapping
    tier: 3
    name: 2D Grid to 1D Strip Mapping
    description: Mapping (x, y) matrix coordinates to a serpentine or row-major strip index
    resources: []

  - id: leds-rendering-primitives
    tier: 3
    name: Matrix Rendering Primitives
    description: Drawing shapes, text, and simple animations on the mapped grid
    resources: []

  - id: leds-periodic-performance
    tier: 3
    name: Keeping the Render Loop Fast
    description: Updating a full matrix's worth of pixels within the robot's periodic() budget
    resources: []

  # --- Tier 4: Master - the game ---
  - id: leds-xbox-input-integration
    tier: 4
    name: Xbox Input for a Matrix Game
    description: Reading Xbox controller input through the team's real input-factory pattern to drive gameplay
    resources:
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: utils/input/xbox_map.py
        label: "Robot-2026's Xbox HID accessor tables - real reference"
      - type: repo
        url: https://github.com/Raptacon/Robot-2026
        path: utils/input/factory.py
        label: "Robot-2026's InputFactory - real reference"

  - id: leds-onboard-game
    tier: 4
    name: Build a Simple On-Robot Matrix Game
    description: >-
      Design and build a simple game (snake, pong, whack-a-mole, etc.)
      rendered on the dot-matrix display, running on the robot itself,
      controlled with an Xbox controller. This is the capstone project -
      not yet scoped beyond this description.
    resources: []
